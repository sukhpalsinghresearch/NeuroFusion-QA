[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofusion-qa"
version = "0.1.1"
description = "Quality, integrity, fusion, and utility validation for multimodal biomedical models"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Sukhpal Singh", email = "ssingh1_phd23@thapar.edu"},
  {name = "Husanbir Singh Pannu"},
  {name = "Poonam Saini"}
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3"
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]
test = ["pytest>=8", "matplotlib>=3.8"]
notebooks = ["ipykernel>=6.29", "nbconvert>=7.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
